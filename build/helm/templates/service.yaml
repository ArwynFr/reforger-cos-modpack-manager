apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-application
  labels:
    {{- include "modpack-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: application
spec:
  selector:
    {{- include "modpack-manager.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: application
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080